<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المشروع - شركة المتحدة العقارية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .project-details-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .proj-header-card {
            background: #141b2b;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .proj-header-card h1 {
            color: #fff;
            font-size: 36px;
            margin-bottom: 15px;
        }
        .proj-header-card .price-tag {
            color: #d4af37;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .proj-header-card p {
            color: #9ca3af;
            font-size: 17px;
            line-height: 1.8;
        }
        .gallery-section h3 {
            color: #fff;
            font-size: 26px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .gallery-item {
            height: 250px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .gallery-item img:hover {
            transform: scale(1.05);
        }
        .back-home-btn {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .back-home-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="brand-logo">
            <h2>المتحدة <span>العقارية</span></h2>
        </div>
        <a href="index.html" class="cta-btn">العودة للرئيسية</a>
    </header>

    <div class="project-details-container" id="project-details-root">
        <!-- سيتم تعبئتها ديناميكياً حسب الـ ID -->
    </div>

    <footer class="main-footer">
        <div class="footer-bottom">
            <p>جميع الحقوق محفوظة &copy; 2026 شركة المتحدة للتطوير العقاري</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            const projects = JSON.parse(localStorage.getItem('almotaheda_projects')) || [];
            const project = projects.find(p => p.id == projectId) || projects[0];

            const root = document.getElementById('project-details-root');
            if (!project) {
                root.innerHTML = '<h2>عذراً، المشروع غير موجود.</h2><a href="index.html" class="btn-gold">العودة للرئيسية</a>';
                return;
            }

            let allImages = [project.img];
            if (project.gallery && Array.isArray(project.gallery)) {
                allImages = allImages.concat(project.gallery);
            }

            root.innerHTML = `
                <a href="index.html" class="back-home-btn">← العودة إلى قائمة المشروعات</a>
                <div class="proj-header-card">
                    <h1>${project.title}</h1>
                    <div class="price-tag">${project.price}</div>
                    <p>${project.desc}</p>
                </div>

                <div class="gallery-section">
                    <h3>معرض صور الكمبوند (الواجهات والشقق من الداخل)</h3>
                    <div class="gallery-grid">
                        ${allImages.map(imgSrc => `
                            <div class="gallery-item">
                                <img src="${imgSrc}" alt="${project.title}">
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div style="text-align: center; margin-bottom: 50px;">
                    <a href="index.html#contact" class="btn-gold" style="padding: 15px 40px; font-size: 18px;">احجز وحدتك الآن في هذا المشروع</a>
                </div>
            `;
        });
    </script>
</body>
</html>
